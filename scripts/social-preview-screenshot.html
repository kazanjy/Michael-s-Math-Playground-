<!DOCTYPE html>
<html>
<head>
  <title>Social Preview - Screenshot This!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      padding: 20px;
    }
    .preview {
      width: 1200px;
      height: 630px;
      background: linear-gradient(to bottom, #0ea5e9 0%, #0284c7 100%);
      position: relative;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .emoji { position: absolute; }

    /* Hero jet scene - top center */
    .hero-jet {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
    }
    .hero-jet .jet { font-size: 100px; position: relative; z-index: 2; }
    .hero-jet .explosion1 { position: absolute; font-size: 50px; left: -60px; top: -20px; z-index: 1; }
    .hero-jet .explosion2 { position: absolute; font-size: 40px; left: -40px; top: 30px; z-index: 1; }
    .hero-jet .missile1 { position: absolute; font-size: 35px; left: -100px; top: 20px; z-index: 0; }
    .hero-jet .missile2 { position: absolute; font-size: 30px; left: -120px; top: 50px; z-index: 0; }
    .hero-jet .missile3 { position: absolute; font-size: 25px; left: -90px; top: 70px; z-index: 0; }

    /* Sparkles - right side */
    .sparkles {
      position: absolute;
      right: 80px;
      top: 180px;
      font-size: 80px;
    }

    /* Title area - centered */
    .title {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 300px;
      font-size: 72px;
      font-weight: bold;
      color: white;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .subtitle {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 400px;
      font-size: 36px;
      font-weight: 600;
      color: white;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .tagline {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 460px;
      font-size: 28px;
      color: rgba(255,255,255,0.9);
    }

    /* Bottom right jet with sparkles */
    .bottom-scene {
      position: absolute;
      right: 100px;
      bottom: 60px;
    }
    .bottom-scene .jet { font-size: 50px; }
    .bottom-scene .sparkle { position: absolute; font-size: 60px; right: -30px; top: -40px; }

    .instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #fbbf24;
      color: #1e293b;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="instructions">Screenshot this at 1200×630 and save as public/social-preview.png</div>

  <div class="preview">
    <!-- Hero jet with explosions and missiles -->
    <div class="hero-jet">
      <span class="explosion1">💥</span>
      <span class="explosion2">💥</span>
      <span class="missile1">🚀</span>
      <span class="missile2">🚀</span>
      <span class="missile3">🚀</span>
      <span class="jet">✈️</span>
    </div>

    <!-- Sparkles on right -->
    <div class="sparkles">✨</div>

    <!-- Title -->
    <div class="title">Michael's Math Dogfight</div>
    <div class="subtitle">Times Tables and Mental Math with Missiles</div>
    <div class="tagline">Ready for takeoff, pilot?</div>

    <!-- Bottom right jet with sparkles -->
    <div class="bottom-scene">
      <span class="sparkle">✨</span>
      <span class="jet">🛩️</span>
    </div>
  </div>
</body>
</html>
